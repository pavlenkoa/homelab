# Emby log lines start with "YYYY-MM-DD HH:MM:SS"; stack traces and the startup banner
# continue on indented lines.
[MULTILINE_PARSER]
    name          emby
    type          regex
    flush_timeout 2000
    rule          "start_state"  "/^\d{4}-\d{2}-\d{2} \d{2}:/"  "cont"
    rule          "cont"         "/^\s/"                         "cont"
