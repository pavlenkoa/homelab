# Fluent Bit on the Mac Mini: ships native Emby logs to the in-cluster Loki.
# Credentials come from the environment (LOKI_USER / LOKI_PASS), loaded by run.sh
# from ~/.config/fluent-bit/loki.env, which is not in git.

[SERVICE]
    Flush         5
    Log_Level     info
    Daemon        off
    Parsers_File  emby-parsers.conf
    HTTP_Server   Off

[INPUT]
    Name              tail
    Tag               emby
    Path              ${HOME}/.config/emby-server/logs/embyserver.txt
    DB                ${HOME}/.config/fluent-bit/emby.db
    multiline.parser  emby
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
    Refresh_Interval  10

[OUTPUT]
    Name                   loki
    Match                  emby
    Host                   ${LOKI_HOST}
    Port                   ${LOKI_PORT}
    tls                    ${LOKI_TLS}
    tls.verify             On
    http_user              ${LOKI_USER}
    http_passwd            ${LOKI_PASS}
    Labels                 job=emby, cluster=homelab, host=macmini-macos
    Auto_Kubernetes_Labels off
    Line_Format            json
    Drop_Single_Key        raw
    Buffer_Size            256KB
