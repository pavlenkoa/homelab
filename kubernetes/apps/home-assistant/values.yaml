# Wrapper chart for Home Assistant
# Defaults here, environment-specific overrides in values/homelab.yaml

# HTTPRoute configuration (empty by default, set in homelab.yaml)
httproute:
  routes: []

# Authelia extAuth TrafficPolicy (empty by default, set in homelab.yaml)
authPolicy:
  enabled: false

home-assistant:
  image:
    repository: ghcr.io/home-assistant/home-assistant
    tag: 2026.11.0@sha256:c6c1ca9931036bf3a2c4cc088d8db25dfea3b33935a5ecc83c40349462e2f69e
  resources:
    requests:
      memory: 530Mi
      cpu: 100m
    limits:
      memory: 1Gi
