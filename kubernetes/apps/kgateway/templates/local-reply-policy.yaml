apiVersion: gateway.kgateway.dev/v1alpha1
kind: HTTPListenerPolicy
metadata:
  name: authz-redirect
  namespace: kgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
  localReplies:
    mappers:
      - filter:
          statusCodeFilter:
            op: EQ
            value: 401
        statusCode: 302
