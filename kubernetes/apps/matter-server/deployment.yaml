apiVersion: apps/v1
kind: Deployment
metadata:
  name: matter-server
  namespace: smarthome
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: matter-server
  template:
    metadata:
      labels:
        app: matter-server
    spec:
      # Matter and Thread rely on IPv6 link-local multicast (mDNS, router advertisements),
      # so the server must sit directly on the LAN. The Pi is on the LAN; the OrbStack VM
      # is behind NAT and would never see the SLZB border router's advertisements.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: raspberrypi
      tolerations:
        - key: dedicated
          operator: Equal
          value: media
          effect: NoSchedule
      # The image runs unprivileged (uid 1000); fsGroup keeps the data dir writable.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: matter-server
          # Open Home Foundation matter.js server (beta), drop-in replacement for the
          # now-unmaintained python-matter-server. Home Assistant connects over WebSocket.
          image: ghcr.io/matter-js/matterjs-server:1.4.0@sha256:54232d0d3e7dff5a54759469d2753399270412b4c30c55b31750a4595e4cb236
          env:
            - name: PRIMARY_INTERFACE
              value: "eth0"
            - name: STORAGE_PATH
              value: "/data"
            - name: TZ
              value: "Europe/Kyiv"
          ports:
            - containerPort: 5580
              name: ws
              hostPort: 5580
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            # Idle with no commissioned nodes: ~2m CPU, ~130Mi memory (Node.js baseline).
            # Memory grows with node count and during commissioning/OTA checks, so the limit
            # keeps ~3x headroom.
            requests:
              memory: 160Mi
              cpu: 10m
            limits:
              memory: 384Mi
      volumes:
        # Holds the Matter fabric (commissioning credentials). Losing it means
        # re-commissioning every Matter device, so it lives on the Pi's SSD and is
        # worth including in backups.
        - name: data
          hostPath:
            path: /var/lib/matter-server
            type: DirectoryOrCreate
