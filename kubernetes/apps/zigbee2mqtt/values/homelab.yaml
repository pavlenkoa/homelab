# Zigbee2MQTT configuration for homelab cluster
# Environment-specific overrides only

httproute:
  routes:
    - name: zigbee2mqtt
      hostname: z2m.pavlenko.io
      gateway:
        name: homelab
        namespace: kgateway-system
      service:
        name: zigbee2mqtt
        port: 8080

authPolicy:
  enabled: true

zigbee2mqtt:
  service:
    type: ClusterIP
    port: 8080

  configmap:
    enabled: false

  statefulset:
    # Chart has no env hook; enable the z2m watchdog via command override.
    # Delays in minutes: 3s, 15s, 30s, 1m, 2m, 5m (default is 2s,1m,5m,15m,30m,60m)
    command:
      - env
      - Z2M_WATCHDOG=0.05,0.25,0.5,1,2,5
      - docker-entrypoint.sh
      - /sbin/tini
      - --
      - node
      - index.js
    # Detect a dead SLZB socket in ~45s (15s idle + 3 x 10s) instead of ~11min.
    # herdsman already enables SO_KEEPALIVE (15s) on the ember tcp socket.
    podSecurityContext:
      sysctls:
        - name: net.ipv4.tcp_keepalive_intvl
          value: "10"
        - name: net.ipv4.tcp_keepalive_probes
          value: "3"
    # Frontend is down while the watchdog waits between retries (up to ~9min total);
    # 20 x 30s = 10min so liveness doesn't kill the container mid-retry.
    livenessProbe:
      failureThreshold: 20
    storage:
      enabled: true
      size: 2Gi
      storageClassName: ""
    securityContext:
      privileged: false
      capabilities:
        drop:
          - ALL

  zigbee2mqtt:
    homeassistant:
      enabled: true
      discovery_topic: homeassistant
      status_topic: homeassistant/status
    permit_join: false
    mqtt:
      server: "mqtt://mosquitto.smarthome:1883"
    serial:
      port: "tcp://192.168.88.154:6638"
      adapter: ember
    frontend:
      port: 8080
    advanced:
      channel: 11
      log_level: info
      last_seen: ISO_8601
      transmit_power: 20
