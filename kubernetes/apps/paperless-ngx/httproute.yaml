# Reachable only on the LAN/VPN: *.pavlenko.io resolves to the private 192.168.88.2
# (wildcard DNS), so there is no public path. Paperless has its own login (and the
# mobile app uses tokens), so no Authelia policy.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paperless
  namespace: paperless
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab
      namespace: kgateway-system
      sectionName: https
  hostnames:
    - paperless.pavlenko.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: paperless
          port: 8000
          weight: 1
