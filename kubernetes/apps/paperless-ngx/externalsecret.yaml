apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless
  namespace: paperless
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: paperless
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: secret_key
      remoteRef:
        key: paperless
        property: secret_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: db_password
      remoteRef:
        key: paperless
        property: db_password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: admin_password
      remoteRef:
        key: paperless
        property: admin_password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
