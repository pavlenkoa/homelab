apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
  namespace: paperless
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: paperless
  template:
    metadata:
      labels:
        app: paperless
    spec:
      # The Service is named "paperless", so k8s would inject PAPERLESS_PORT=tcp://...
      # which collides with Paperless's own PAPERLESS_PORT setting and crashes it.
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: macmini
      containers:
        - name: paperless
          image: ghcr.io/paperless-ngx/paperless-ngx:3.5.0
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PAPERLESS_REDIS
              value: redis://paperless-redis:6379
            - name: PAPERLESS_DBENGINE   # required since v3 (no longer inferred from DBHOST)
              value: postgresql
            - name: PAPERLESS_DBHOST
              value: paperless-postgres
            - name: PAPERLESS_DBNAME
              value: paperless
            - name: PAPERLESS_DBUSER
              value: paperless
            - name: PAPERLESS_DBPASS
              valueFrom:
                secretKeyRef:
                  name: paperless
                  key: db_password
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: paperless
                  key: secret_key
            - name: PAPERLESS_ADMIN_USER
              value: andrii
            - name: PAPERLESS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paperless
                  key: admin_password
            - name: PAPERLESS_URL
              value: https://paperless.pavlenko.io
            # The iCloud consume folder is owned by the Mac user (uid/gid 501 in the VM);
            # Paperless must run as that user to delete files after ingesting them.
            - name: USERMAP_UID
              value: "501"
            - name: USERMAP_GID
              value: "501"
            # Cap OCR parallelism: unset, it follows the VM's CPU count (10) and OOM-kills the
            # 2Gi pod when several PDFs with a text layer get rasterised at once.
            - name: PAPERLESS_TASK_WORKERS
              value: "1"
            - name: PAPERLESS_THREADS_PER_WORKER
              value: "2"
            - name: PAPERLESS_TIME_ZONE
              value: Europe/Warsaw
            - name: PAPERLESS_OCR_LANGUAGE
              value: eng+ukr+pol
            - name: PAPERLESS_OCR_LANGUAGES
              value: ukr pol
            # v3 allows duplicates by default; reject them so a re-dropped file is ignored
            - name: PAPERLESS_CONSUMER_DELETE_DUPLICATES
              value: "true"
            # Native fs notifications don't work on the iCloud/virtiofs mount -> poll (v3 name)
            - name: PAPERLESS_CONSUMER_POLLING_INTERVAL
              value: "30"
          readinessProbe:
            httpGet:
              path: /
              port: http
              # With PAPERLESS_URL set, v3 only accepts that host + localhost; the
              # kubelet would otherwise probe with the pod IP as Host and get a 400.
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /usr/src/paperless/data
            - name: media
              mountPath: /usr/src/paperless/media
            - name: consume
              mountPath: /usr/src/paperless/consume
          resources:
            requests:
              memory: 768Mi
              cpu: 200m
            limits:
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperless-data
        - name: media
          persistentVolumeClaim:
            claimName: paperless-media
        # iCloud Drive folder (OrbStack mounts the Mac's /Users into the VM). Anything
        # copied there from iPhone/Mac is ingested, then removed by Paperless - so drop
        # COPIES, not your only original. Keep the folder "Downloaded" in Finder so
        # iCloud doesn't evict files.
        - name: consume
          hostPath:
            path: /Users/andrii/Library/Mobile Documents/com~apple~CloudDocs/Paperless
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: paperless
  namespace: paperless
spec:
  selector:
    app: paperless
  ports:
    - port: 8000
      targetPort: 8000
      name: http
