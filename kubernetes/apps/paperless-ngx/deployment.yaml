apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
  namespace: paperless
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: paperless
  template:
    metadata:
      labels:
        app: paperless
    spec:
      nodeSelector:
        kubernetes.io/hostname: macmini
      containers:
        - name: paperless
          image: ghcr.io/paperless-ngx/paperless-ngx:2.20.0
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PAPERLESS_REDIS
              value: redis://paperless-redis:6379
            - name: PAPERLESS_DBHOST
              value: paperless-postgres
            - name: PAPERLESS_DBNAME
              value: paperless
            - name: PAPERLESS_DBUSER
              value: paperless
            - name: PAPERLESS_DBPASS
              valueFrom:
                secretKeyRef:
                  name: paperless
                  key: db_password
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: paperless
                  key: secret_key
            - name: PAPERLESS_ADMIN_USER
              value: admin
            - name: PAPERLESS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paperless
                  key: admin_password
            - name: PAPERLESS_URL
              value: https://paperless.pavlenko.io
            - name: PAPERLESS_TIME_ZONE
              value: Europe/Warsaw
            - name: PAPERLESS_OCR_LANGUAGE
              value: eng+ukr+pol
            - name: PAPERLESS_OCR_LANGUAGES
              value: ukr pol
            - name: PAPERLESS_CONSUMER_POLLING
              value: "30"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /usr/src/paperless/data
            - name: media
              mountPath: /usr/src/paperless/media
            - name: consume
              mountPath: /usr/src/paperless/consume
          resources:
            requests:
              memory: 768Mi
              cpu: 200m
            limits:
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperless-data
        - name: media
          persistentVolumeClaim:
            claimName: paperless-media
        # iCloud Drive folder (OrbStack mounts the Mac's /Users into the VM). Anything
        # copied there from iPhone/Mac is ingested, then removed by Paperless - so drop
        # COPIES, not your only original. Keep the folder "Downloaded" in Finder so
        # iCloud doesn't evict files.
        - name: consume
          hostPath:
            path: /Users/andrii/Library/Mobile Documents/com~apple~CloudDocs/Paperless
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: paperless
  namespace: paperless
spec:
  selector:
    app: paperless
  ports:
    - port: 8000
      targetPort: 8000
      name: http
