apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qbittorrent
  namespace: qbittorrent
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  serviceName: qbittorrent
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      nodeSelector:
        kubernetes.io/hostname: raspberrypi
      tolerations:
        - key: dedicated
          operator: Equal
          value: media
          effect: NoSchedule
      # Pod initiates traffic only to public endpoints via VPN — never to cluster services.
      # Skip cluster DNS injection: k8s default ClusterFirst adds search domains + ndots:5,
      # causing every public hostname lookup to fan out into multiple NXDOMAIN queries against
      # .cluster.local variants. Under sustained external DNS load this amplification burns
      # significant CPU on ARM hardware. Empty searches eliminates the expansion.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 127.0.0.1
        searches: []
        options:
          - name: ndots
            value: "1"
      containers:
        - name: gluetun
          image: qmcgaw/gluetun:latest@sha256:e3272b29a4bc177b389fbdcb54cf9716ccbfc30f04d8b7a35b0a5be9cdb58461
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - SYS_MODULE
          lifecycle:
            postStart:
              exec:
                command: ["sh", "-c", "ip rule del table 51820 2>/dev/null; ip -6 rule del table 51820 2>/dev/null; true"]
          env:
            - name: TZ
              value: "Europe/Kyiv"
            - name: VPN_SERVICE_PROVIDER
              value: "protonvpn"
            - name: VPN_TYPE
              value: "wireguard"
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: gluetun-vpn
                  key: WIREGUARD_PRIVATE_KEY
            - name: SERVER_COUNTRIES
              value: "Germany"
            - name: SERVER_CITIES
              value: "Frankfurt"
            - name: PORT_FORWARD_ONLY
              value: "on"
            - name: VPN_PORT_FORWARDING
              value: "on"
            - name: VPN_PORT_FORWARDING_PROVIDER
              value: "protonvpn"
            # Pushes the forwarded port into qBittorrent via its WebUI API using the
            # stock image's bundled wget (no curl in qmcgaw/gluetun, no custom image
            # needed). Relies on WebUI > Advanced > "Bypass authentication for clients
            # in whitelisted IP subnets" being set to "127.0.0.1/32,10.0.0.0/16" (loopback
            # for this call, plus the Cilium pod CIDR so qui/qbittorrent-exporter also
            # authenticate for free — set manually once, see migration runbook), since
            # this call carries no login credentials.
            - name: VPN_PORT_FORWARDING_UP_COMMAND
              value: "/bin/sh -c \"until wget -q -O /dev/null --post-data='json={\\\"listen_port\\\":{{PORTS}}}' http://127.0.0.1:9091/api/v2/app/setPreferences 2>/dev/null; do echo 'Waiting for qBittorrent to be ready...'; sleep 5; done && echo 'Port {{PORTS}} set successfully'\""
            - name: FIREWALL
              value: "on"
            - name: FIREWALL_INPUT_PORTS
              value: "9091"
            # Use embedded Unbound with caching — cache hits avoid upstream queries
            # under high-frequency hostname lookup patterns.
            - name: DNS_UPSTREAM_RESOLVER_TYPE
              value: "dot"
            - name: DNS_UPSTREAM_RESOLVERS
              value: "quad9"
            - name: DNS_CACHING
              value: "on"
          volumeMounts:
            - name: tun-device
              mountPath: /dev/net/tun
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
            - name: xtables-lock
              mountPath: /run/xtables.lock
            - name: gluetun-tmp
              mountPath: /tmp/gluetun
          ports:
            - containerPort: 9091
              name: web
          livenessProbe:
            exec:
              command:
                - /gluetun-entrypoint
                - healthcheck
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 15
            # raspberrypi's media disk periodically saturates for hours (torrent
            # rechecks) — exec probes stall waiting on containerd during those
            # windows. Default failureThreshold: 3 (~90s) was killing the pod
            # mid-recheck, which just restarts the recheck and repeats the loop.
            # 8 gives ~4min of continuous failure before a restart.
            failureThreshold: 8

        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:5.2.3@sha256:304b19cf94bf4fda534e0b086cab9c5f1a9e139a8180c05c0ad7d2ba1526fa99
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Kyiv"
            - name: WEBUI_PORT
              value: "9091"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: watch
              mountPath: /watch
            - name: downloads-tv
              mountPath: /downloads/tv
            - name: downloads-movies
              mountPath: /downloads/movies
            - name: downloads-tvanimation
              mountPath: /downloads/tvanimation
            - name: downloads-animation
              mountPath: /downloads/animation

      volumes:
        - name: tun-device
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: lib-modules
          hostPath:
            path: /lib/modules
            type: Directory
        - name: xtables-lock
          hostPath:
            path: /run/xtables.lock
            type: FileOrCreate
        - name: gluetun-tmp
          emptyDir: {}
        - name: config
          hostPath:
            path: /home/andrii/qbittorrent-config
            type: DirectoryOrCreate
        - name: watch
          hostPath:
            path: /media/transmission/watch
            type: Directory
        - name: downloads-tv
          hostPath:
            path: /media/emby/tv
            type: Directory
        - name: downloads-movies
          hostPath:
            path: /media/emby/movies
            type: Directory
        - name: downloads-tvanimation
          hostPath:
            path: /media/emby/tvanimation
            type: Directory
        - name: downloads-animation
          hostPath:
            path: /media/emby/animation
            type: Directory
