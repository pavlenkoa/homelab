apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent-exporter
  namespace: qbittorrent
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent-exporter
  template:
    metadata:
      labels:
        app: qbittorrent-exporter
    spec:
      # No nodeSelector/toleration — raspberrypi's "dedicated=media" taint keeps this
      # off the Pi automatically, so it lands on macmini. Reaches qBittorrent over its
      # ClusterIP Service rather than localhost, since it no longer shares gluetun's pod.
      # No credentials needed: qBittorrent's WebUI > Advanced > "Bypass authentication
      # for clients in whitelisted IP subnets" is set to the cluster pod CIDR (see
      # statefulset.yaml), so in-cluster callers like this one authenticate for free —
      # matching Transmission's unauthenticated RPC today.
      containers:
        - name: qbittorrent-exporter
          image: ghcr.io/martabal/qbittorrent-exporter:v2.0.2@sha256:0e818e0240cc968fffdeba5f43a5f1452d72095a4324cea0cc18871e54805902
          env:
            - name: QBITTORRENT_BASE_URL
              value: "http://qbittorrent.qbittorrent.svc.cluster.local:9091"
            - name: EXPORTER_PORT
              value: "19091"
            # Adds the torrent hash to qbittorrent_torrent_* labels so two torrents
            # with the same display name don't collide into one Prometheus series.
            - name: ENABLE_LABEL_WITH_HASH
              value: "true"
          ports:
            - containerPort: 19091
              name: metrics
