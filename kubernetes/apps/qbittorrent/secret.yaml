apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gluetun-vpn
  namespace: qbittorrent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: gluetun-vpn
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: WIREGUARD_PRIVATE_KEY
      remoteRef:
        key: wireguard
        property: private_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# qui's OIDC client secret (plaintext). Authelia holds the PBKDF2 hash of the same
# value for its own client config — both are generated together by vault-secrets-generator.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qui-oidc
  namespace: qbittorrent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: qui-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: QUI__OIDC_CLIENT_SECRET
      remoteRef:
        key: authelia
        property: qui_oidc_client_plaintext
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
